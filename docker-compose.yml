version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skillswap-postgres
    restart: always
    environment:
      POSTGRES_USER: skillswap_user
      POSTGRES_PASSWORD: skillswap_password
      POSTGRES_DB: skillswap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: skillswap-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillswap-backend
    restart: always
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://skillswap_user:skillswap_password@db:5432/skillswap_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretkeypleasechangemeinproduction
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillswap-frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
